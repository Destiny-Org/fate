# very similar to the Destiny script: https://github.com/Destiny-Org/destiny/blob/main/.github/workflows/main.yml

name: Main
on:
  - pull_request # without merge conflicts
  - push # branch or tag

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built with a released Destiny compiler (Destiny-Org/host-compilers),
          # which exists for Linux x86_64 only; other platforms return once
          # Destiny is packaged for them.
          - job_name: Ubuntu 22.04 x64
            os: ubuntu-22.04
          - job_name: Ubuntu 22.04 x86
            os: ubuntu-22.04
            model: 32
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container_image }}
    timeout-minutes: ${{ matrix.timeout-minutes || 40 }}
    env:
      # read access to the private Destiny-Org repositories, for every clone in the build
      DESTINY_REPO_TOKEN: ${{ secrets.DESTINY_REPO_TOKEN }}
      # for ci/run.sh:
      OS_NAME: ${{ matrix.vm_os || (startsWith(matrix.os, 'ubuntu') && 'linux' || (startsWith(matrix.os, 'macos') && 'osx' || (startsWith(matrix.os, 'windows') && 'windows' || ''))) }}
      MODEL: ${{ matrix.model || '64' }}
      HOST_DC: destiny-2.115.0-master
      # N is set dynamically below
      FULL_BUILD: false
      # work around upstream issue 23517
      MACOSX_DEPLOYMENT_TARGET: '11'
    defaults:
      run:
        # cpa.sh comes with cross-platform-actions and delegates to the VM.
        # Use it by default for all `run` steps below, i.e., run them in the VM (with a bash shell).
        shell: ${{ matrix.vm_os && 'cpa.sh {0} --sync-files runner-to-vm --environment-variables OS_NAME MODEL HOST_DC CI_DFLAGS N FULL_BUILD DESTINY_REPO_TOKEN' || 'bash' }}
    steps:
      - name: Start VM
        if: matrix.vm_os
        uses: cross-platform-actions/action@v1.5.0
        with:
          operating_system: ${{ matrix.vm_os }}
          version: ${{ matrix.vm_os_version }}
          shell: bash
          memory: 12G
          cpu_count: 4
          sync_files: runner-to-vm

      - name: 'Alpine container: Pre-install bash, git and sudo'
        if: startsWith(matrix.container_image, 'alpine')
        shell: sh
        run: apk add bash git sudo
      - name: 'FreeBSD VM: Pre-install git'
        if: matrix.vm_os == 'freebsd'
        run: sudo pkg install -y git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: Clone destiny
        env:
          DESTINY_REPO_TOKEN: ${{ secrets.DESTINY_REPO_TOKEN }}
        run: |
          set -uexo pipefail

          ref='${{ github.ref }}'
          if [[ "$ref" =~ ^refs/pull/ ]]; then
            # PR: clone the Destiny head with the same name as this Fate PR's target branch
            # e.g., Destiny stable when targeting Fate stable
            REPO_BRANCH="$GITHUB_BASE_REF"
          elif [[ "$ref" =~ ^refs/(heads|tags)/(.*)$ ]]; then
            # no PR: clone the Destiny head with the same name as this Fate head
            # e.g., Destiny stable for a push to Fate stable, or Destiny v2.105.2 for Fate tag v2.105.2
            REPO_BRANCH="${BASH_REMATCH[2]}"
          else
            echo "Error: unexpected GitHub ref '$ref'" >&2
            exit 1
          fi

          # DESTINY_REPO_TOKEN (read access) is needed while Destiny-Org/destiny is private
          url=https://github.com/Destiny-Org/destiny.git
          [ -z "${DESTINY_REPO_TOKEN:-}" ] || url="https://x-access-token:${DESTINY_REPO_TOKEN}@github.com/Destiny-Org/destiny.git"
          git clone --branch "$REPO_BRANCH" --depth 1 "$url" ../destiny_engine

      - name: Set environment variable N (parallelism)
        run: echo "N=$(${{ runner.os == 'macOS' && 'sysctl -n hw.logicalcpu' || 'nproc' }})" >> $GITHUB_ENV
        shell: bash  # don't run in VM, but host runner (for exporting env var)

      - name: 'Posix: Install prerequisites'
        if: runner.os != 'Windows'
        run: cd ../destiny_engine && ${{ runner.os == 'macOS' && 'ci/cirrusci.sh' || 'sudo -E ci/cirrusci.sh' }}
      - name: 'Windows: Set up MSVC environment'
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
        with:
          arch: ${{ env.MODEL == '64' && 'x64' || 'x86' }}

      - name: 'Posix: Install host compiler'
        if: runner.os != 'Windows'
        run: cd ../destiny_engine && ci/run.sh install_host_compiler
      - name: 'Windows: Install host compiler'
        if: runner.os == 'Windows'
        shell: bash
        run: bash ../destiny_engine/ci/host_compiler.sh destiny-2.115.0-master

      - name: Build
        run: cd ../destiny_engine && ci/run.sh build
      - name: Test destiny
        run: cd ../destiny_engine && ci/run.sh test_destiny
      - name: Test druntime
        run: cd ../destiny_engine && ci/run.sh test_druntime
      - name: 'Windows x86: Add 32-bit libcurl.dll to PATH (required for Fate unittests)'
        if: runner.os == 'Windows' && env.MODEL == '32'
        run: echo "$(dirname "$DC")/../lib32" >> $GITHUB_PATH
      - name: Test Fate
        run: cd ../destiny_engine && ci/run.sh test_fate
